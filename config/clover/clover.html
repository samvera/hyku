<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
          /* Clover inherits its text colour from this page, and every show theme frames the
             viewer in black, so a transparent page left the panel black on black. */
          html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; color-scheme: dark; }
          .clover-viewer-information-panel a { color: #7fb8ff; }
          clover-viewer { display: block; height: 100%; }
          clover-viewer :has(.clover-viewer-content) { height: 100% !important; }
          .clover-viewer-content { height: 100% !important; }
          .clover-viewer-player-wrapper,
          .clover-viewer-painting :has(> .clover-viewer-player-wrapper) { background-color: transparent !important; }
          .clover-viewer-information-panel { overflow-wrap: anywhere; }
          [data-testid="information-panel-cue"] strong { white-space: nowrap; margin-left: .75rem; }
          .clover-viewer-information-panel, .clover-viewer-information-panel * { box-sizing: border-box; }
          .clover-viewer-header > span:first-child { padding-left: 1rem !important; }
          .clover-viewer-header > div:last-child { padding-right: 1rem !important; }
          /* Clover caps its player at 500px, which left a black band under it in the taller show page frame. */
          .clover-viewer-player-wrapper, .clover-viewer-player-wrapper video { height: 100% !important; max-height: none !important; }
          video::cue { font-size: clamp(14px, 2.4vw, 24px); }
        </style>
    </head>
    <body>
    <script type="text/javascript" src="clover.js"></script>
    <clover-viewer></clover-viewer>
    <script>
        const manifestUrl = new URLSearchParams(window.location.search).get('manifest');
        const viewer = document.querySelector('clover-viewer');
        // Clover takes the manifest URL from `id`, and setAttribute would stringify
        // a missing one to "null" rather than leaving it unset.
        if (manifestUrl) viewer.setAttribute('id', manifestUrl);

        // The web component cannot pass Clover the option to start with its information panel
        // closed, and Clover opens it once mounted, so close it whenever it opens until the
        // visitor uses the toggle themselves.
        const keepPanelClosed = new MutationObserver(() => {
          const toggle = document.getElementById('information-toggle');
          if (toggle?.getAttribute('aria-checked') === 'true') toggle.click();
        });
        keepPanelClosed.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['aria-checked'] });
        ['pointerdown', 'keydown'].forEach((type) => {
          document.addEventListener(type, (event) => {
            if (event.target.closest?.('#information-toggle')) keepPanelClosed.disconnect();
          }, true);
        });

        // An audio item has no picture for the control bar to sit over, so its captions land behind
        // the bar. Chrome sets a cue's top at its line, so leave room for the bar and two caption lines.
        const CAPTION_CLEARANCE = 130;
        const liftAudioCaptions = (media) => {
          if (media.readyState < 1 || media.videoWidth > 0 || !media.clientHeight) return;
          const line = Math.max(0, 100 - (CAPTION_CLEARANCE / media.clientHeight) * 100);
          for (const track of media.textTracks) {
            for (const cue of track.cues || []) Object.assign(cue, { snapToLines: false, line });
          }
        };
        ['loadedmetadata', 'load'].forEach((type) => {
          document.addEventListener(type, (event) => {
            const media = event.target.closest?.('audio, video');
            if (media) liftAudioCaptions(media);
          }, true);
        });
        window.addEventListener('resize', () => document.querySelectorAll('audio, video').forEach(liftAudioCaptions));
    </script>
    </body>
</html>
