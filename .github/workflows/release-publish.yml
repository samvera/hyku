name: Publish Release

on:
  push:
    branches:
      - production

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find draft release
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | head -1)
          if [ -z "$draft" ]; then
            echo "No draft release found, skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$draft" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for image builds
        if: steps.find.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list -w build-test-lint.yaml -b production \
              --json databaseId,headSha \
              -q ".[] | select(.headSha==\"$GITHUB_SHA\") | .databaseId" \
              | head -1)
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::build-test-lint run not found after 5 minutes"
            exit 1
          fi
          echo "Waiting for build-test-lint run $run_id..."
          gh run watch "$run_id" --exit-status

      - name: Publish draft release
        if: steps.find.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false

      - name: Trigger release images
        if: steps.find.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
