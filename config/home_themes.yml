# These settings are to provide information about your theme
# and should follow the format
# default:
#   name: Default theme
# An optional configuration for theme colors can be defined, which will add
# a button to the appearance colors section of the admin dashboard, allowing
# the user to easily set the custom colors. Only colors which are included
# will be overwritten from the defaults.
#   theme_custom_colors:
#     collection_banner_text_color: '#000000'
#     default_button_background_color: '#FFFFFF'
#     default_button_border_color: '#5B5B5B'
#
default_home:
  banner_image: true
  featured_researcher: true
  home_page_text: false
  marketing_text: true
  name: Default home
  notes: This theme is the default Hyku view
cultural_repository:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Cultural Repository
  notes: This theme is recommended for cultural repositories
institutional_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Institutional Repository
  notes: This theme is recommended for institutional repositories
neutral_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Neutral Repository
  notes: This theme is neutral and is recommended for all types of repositories
community:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Community
  notes: This theme is for demoing Hyku features
practice_research:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Practice Research
  notes: A search-led hero over the banner image whose intro copy comes from the marketing text, a counts band that carries the home page text beside the counts, featured collections and works, browse by work type and subject, recently uploaded, a featured researcher, and an about band. The accent rides the primary button colors, the dark bands ride the header and footer background, and links carry the brand.
heritage:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Heritage
  notes: A catalog-first theme for digitized physical collections. Objects sit on paper mats and are never cropped, and the facet rail is promoted to the home page as Browse the collection. The hero headline comes from the marketing text and the prose band under it from the home page text. Serif for objects and prose, sans for interface chrome, riding the tenant headline and body fonts. Links carry the brand and the dark chrome rides the header and footer background.
screening_room:
  banner_image: false
  featured_researcher: true
  home_page_text: true
  marketing_text: false
  name: Screening Room
  notes: A dark theme for moving image and long-form audio, where the object plays before it is described. A cycling spotlight opens a featured work in a player without leaving the page, then a lede band carries the home page text beside the holdings counts, a recessed shelf shows the collections as objects, latest additions sits beside the featured researcher, and an about band and a deposit band close the page. Every dark surface derives from the header and footer background color, and the accent, chips and links carry the link color.
