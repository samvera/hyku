name: Draft Release Notes

on:
  push:
    paths-ignore:
      - config/initializers/version.rb
    branches:
      - staging
      - staging-test
      - production
      - production-test

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    # The version-bump commit is made by this workflow; never let it invoke itself.
    if: ${{ !startsWith(github.event.head_commit.message, 'Bump version to v') }}
    runs-on: ubuntu-latest
    env:
      IS_STAGING: ${{ contains(github.ref_name, 'staging') }}
    steps:
      - name: Generate auto-merger App token
        id: auto_merger_token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.AUTO_MERGER_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.auto_merger_token.outputs.token }}
          persist-credentials: true

      - name: Resolve next version
        id: next-version
        uses: release-drafter/release-drafter@v6
        with:
          config-name: ${{ env.IS_STAGING == 'true' && 'release-drafter-staging.yml' || 'release-drafter.yml' }}
          commitish: ${{ github.ref_name }}
          prerelease: ${{ env.IS_STAGING }}
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version file
        id: bump
        env:
          RESOLVED_VERSION: ${{ steps.next-version.outputs.resolved_version }}
          TAG_NAME: ${{ steps.next-version.outputs.tag_name }}
        run: |
          if [ -z "$RESOLVED_VERSION" ]; then
            echo "No resolved version from release-drafter, skipping bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(grep -oP "VERSION = '\K[^']+" config/initializers/version.rb)
          VERSION=$(ruby .github/scripts/release_version.rb "$CURRENT" "$RESOLVED_VERSION" "${{ env.IS_STAGING }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Version already ${VERSION}, skipping bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/VERSION = '.*'/VERSION = '${VERSION}'/" config/initializers/version.rb
          echo "Updated version to ${VERSION}"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # The auto-merger App must be a bypass actor for protected release branches.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/initializers/version.rb
          git commit -m "Bump version to v${VERSION}"
          git push

      - name: Draft release notes with resolved version
        if: steps.bump.outputs.version != ''
        uses: release-drafter/release-drafter@v6
        with:
          config-name: ${{ env.IS_STAGING == 'true' && 'release-drafter-staging.yml' || 'release-drafter.yml' }}
          commitish: ${{ github.ref_name }}
          version: ${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          tag: v${{ steps.bump.outputs.version }}
          prerelease: ${{ env.IS_STAGING }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
