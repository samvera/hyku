# These settings are to provide information about your theme
# and should follow the format
# default:
#   name: Default theme
# An optional configuration for theme colors can be defined, which will add
# a button to the appearance colors section of the admin dashboard, allowing
# the user to easily set the custom colors. Only colors which are included
# will be overwritten from the defaults.
#   theme_custom_colors:
#     collection_banner_text_color: '#000000'
#     default_button_background_color: '#FFFFFF'
#     default_button_border_color: '#5B5B5B'
#
default_home:
  banner_image: true
  featured_researcher: true
  home_page_text: false
  marketing_text: true
  name: Default home
  notes: This theme is the default Hyku view
cultural_repository:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Cultural Repository
  notes: This theme is recommended for cultural repositories
institutional_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Institutional Repository
  notes: This theme is recommended for institutional repositories
neutral_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Neutral Repository
  notes: This theme is neutral and is recommended for all types of repositories
community:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Community
  notes: This theme is for demoing Hyku features
practice_research:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: false
  name: Practice Research
  notes: A search-led hero over the banner image, a counts band, featured collections and works, browse by work type and subject, recently uploaded, a featured researcher, and an about band. The accent rides the primary button colors, the dark bands ride the header and footer background, and links carry the brand.
practice_research_media:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: false
  parent: practice_research
  name: Practice Research - Media
  notes: The Practice Research look reordered for audiovisual archives, where the works are the draw - featured works lead, recent uploads follow, browse and collections come after. Wider cards give players and stills room. Colors ride Admin > Appearance exactly as Practice Research does.
practice_research_cultural:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: false
  parent: practice_research
  name: Practice Research - Cultural
  notes: The Practice Research look reordered for cultural heritage and DAMS collections, where curation is the story - featured collections lead, featured works follow, browse and recent activity come after. A roomier band rhythm and larger display headlines let imagery breathe. Colors ride Admin > Appearance exactly as Practice Research does.
practice_research_scholarly:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: false
  parent: practice_research
  name: Practice Research - Scholarly
  notes: The Practice Research look with the sections reordered for an institutional repository, where recency and entry points matter most - browse by work type and subject leads, recent uploads and the featured researcher come next, then featured works and collections. A slightly tighter band rhythm and type scale for text-dense content. Colors ride Admin > Appearance exactly as Practice Research does.
